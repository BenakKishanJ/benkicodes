[project]
name = "content-pipeline"
version = "0.1.0"
description = "LangGraph content pipeline: sources -> reviewed blog post -> commit to the Astro site"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openrouter>=0.2.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "pymupdf>=1.24",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "markdown-it-py>=3",
  "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=3.0"]

[project.scripts]
pipeline = "pipeline.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
